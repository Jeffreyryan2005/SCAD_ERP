    <header id="header" class="header">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle menu">

            <div class="content-header" style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <h2>Staff Management</h2>
                <button id="addStaffBtn" class="btn btn--primary">
                    <span style="margin-right: 4px;">+</span> Add Staff
                </button>
            </div>

            <div style="padding: 0 1.5rem 1.5rem 1.5rem;">
                <div class="card" style="padding: 1.5rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem; flex-wrap:wrap; gap:1rem;">
                        <div style="display:flex; gap:1rem; flex:1; max-width:600px;">
                            <input type="text" id="searchInput" class="form-input" placeholder="Search by name or username..." style="flex:1">
                            <select id="filterDept" class="form-input">
                                <option value="">All Depts</option>
                                <option value="CSE">CSE</option>
                                <option value="IT">IT</option>
                                <option value="ECE">ECE</option>
                                <option value="EEE">EEE</option>
                                <option value="MECH">MECH</option>
                                <option value="CIVIL">CIVIL</option>
                                <option value="ALL_I">First Year (S&H)</option>
                            </select>
                            <select id="filterRole" class="form-input">
                                <option value="">All Roles</option>
                                <option value="hod">HOD</option>
                                <option value="faculty">Faculty</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="attendance-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th>Designation</th>
                                    <th>Role</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal -->
        <div id="staffModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center;">
            <div class="modal-card" style="max-width:500px; width:90%; background:var(--color-surface); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.2); overflow-y:auto; max-height:90vh;">
                <div class="modal-header" style="padding:1.5rem; border-bottom:1px solid var(--color-border); display:flex; justify-content:space-between; align-items:center;">
                    <h3 id="modalTitle">Add Staff</h3>
                    <button id="closeModalBtn" class="btn btn--icon" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
                </div>
                <div class="modal-body" style="padding:1.5rem;">
                    <form id="staffForm" autocomplete="off">
                        <input type="hidden" id="staffId">
                        
                        <div class="form-group">
                            <label class="form-label" for="staffUsername">Username (ID)</label>
                            <input type="text" id="staffUsername" class="form-input form-input--full" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="staffName">Full Name</label>
                            <input type="text" id="staffName" class="form-input form-input--full" required>
                        </div>
                        
                        <div style="display:flex; gap:1rem;">
                            <div class="form-group" style="flex:1;">
                                <label class="form-label" for="staffRole">Role</label>
                                <select id="staffRole" class="form-input form-input--full" required>
                                    <option value="faculty">Faculty</option>
                                    <option value="hod">HOD</option>
                                </select>
                            </div>
                            <div class="form-group" style="flex:1;">
                                <label class="form-label" for="staffDept">Department</label>
                                <select id="staffDept" class="form-input form-input--full" required>
                                    <option value="CSE">CSE</option>
                                    <option value="IT">IT</option>
                                    <option value="ECE">ECE</option>
                                    <option value="EEE">EEE</option>
                                    <option value="MECH">MECH</option>
                                    <option value="CIVIL">CIVIL</option>
                                    <option value="ALL_I">First Year (S&H)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="staffDesignation">Designation</label>
                            <input type="text" id="staffDesignation" class="form-input form-input--full" required>
                        </div>

                        <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
                            <button type="button" id="cancelBtn" class="btn btn--outline">Cancel</button>
                            <button type="submit" class="btn btn--primary">Save Staff</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Toast Notification -->
        <div id="toast" class="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 24px; border-radius:4px; z-index:9999;"></div>
    </div>
