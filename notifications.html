    <style>
        .notifications-list {
            display: flex; flex-direction: column; gap: 1rem; max-width: 800px;
        }
        .notification-card {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-primary); border-radius: 8px;
            padding: 1rem 1.5rem; display: flex; justify-content: space-between;
            align-items: flex-start; transition: all 0.2s ease;
        }
        .notification-card.unread { background: var(--color-background); font-weight: 500; }
        .notification-card.warning { border-left-color: #F57C00; }
        .notification-card.info { border-left-color: #1976D2; }
        .notification-card.success { border-left-color: #2E7D32; }
        .notification-card.danger { border-left-color: #D32F2F; }
        .notification-content h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
        .notification-content p { margin: 0 0 0.5rem 0; color: var(--color-text-muted); }
        .notification-meta { font-size: 0.85rem; color: var(--color-text-muted); }
        .notification-actions { display: flex; gap: 0.5rem; }
    </style>
</head>
