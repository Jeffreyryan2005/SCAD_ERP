    <style>
        .pwd-card {
            background: var(--color-surface, #fff);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 2rem;
            max-width: 480px;
        }
        .pwd-card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.3rem;
        }
        .pwd-card p.subtitle {
            color: var(--color-text-muted, #666);
            font-size: 0.9rem;
            margin: 0 0 1.5rem 0;
        }
        .pwd-strength {
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            margin: 0.5rem 0 0.25rem 0;
            overflow: hidden;
        }
        .pwd-strength-bar {
            height: 100%;
            border-radius: 3px;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }
        .pwd-strength-text {
            font-size: 0.75rem;
            color: var(--color-text-muted, #888);
            margin-bottom: 1rem;
        }
        .pwd-rules {
            font-size: 0.8rem;
            color: var(--color-text-muted, #888);
            margin: 0.5rem 0 1rem 0;
            line-height: 1.6;
        }
        .pwd-rules span { display: block; }
        .pwd-rules span.pass { color: #2E7D32; }
        .pwd-rules span.fail { color: #C62828; }
        .pwd-error {
            color: #C62828;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            display: none;
        }
        .pwd-success {
            color: #2E7D32;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            display: none;
            font-weight: 600;
        }
    </style>

            <div style="padding: 2rem;">
                <div class="pwd-card">
                    <h2> Change Your Password</h2>
                    <p class="subtitle">Keep your account secure by updating your password regularly.</p>

                    <form id="change-pwd-form" autocomplete="off">
                        <div class="form-group">
                            <label class="form-label" for="current-pwd">Current Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="current-pwd" class="form-input form-input--full" placeholder="Enter current password" required>
                                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="window.togglePasswordVisibility('current-pwd', this)">
                                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="new-pwd">New Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="new-pwd" class="form-input form-input--full" placeholder="Enter new password" required>
                                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="window.togglePasswordVisibility('new-pwd', this)">
                                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        <div class="pwd-strength"><div id="pwd-strength-bar" class="pwd-strength-bar"></div></div>
                        <div id="pwd-strength-text" class="pwd-strength-text"></div>
                        <div id="pwd-rules" class="pwd-rules"></div>
                        <div class="form-group">
                            <label class="form-label" for="confirm-pwd">Confirm New Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="confirm-pwd" class="form-input form-input--full" placeholder="Re-enter new password" required>
                                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="window.togglePasswordVisibility('confirm-pwd', this)">
                                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        <div id="security-q-section" class="form-group" style="display:none; background:#FFF8E1; padding:1rem; border-radius:8px; border:1px solid #FFE082;">
                            <label class="form-label" style="color:#F57F17;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> Security Verification</label>
                            <p id="security-q-label" style="font-size:0.9rem; color:#5D4037; margin:0.25rem 0 0.5rem 0;"></p>
                            <input type="text" id="security-answer" class="form-input form-input--full" placeholder="Your answer" required>
                        </div>
                        <div id="pwd-error" class="pwd-error"></div>
                        <div id="pwd-success" class="pwd-success"></div>
                        <button type="submit" class="btn btn--primary" style="padding: 10px 2rem;">Update Password</button>
                    </form>
                </div>
