        .timetable-editor {
            background: var(--color-surface); border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 2rem;
        }
        .editor-toolbar {
            display: flex; gap: 1rem; align-items: center;
            margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .editor-toolbar select { min-width: 200px; }
        .period-cell {
            padding: 0.5rem; min-width: 120px;
        }
        .period-cell select {
            width: 100%; padding: 6px; border: 1px solid var(--color-border);
            border-radius: 4px; background: var(--color-background);
            color: var(--color-text);
        }
    </style>

    <header id="header" class="header">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="header__spacer"></div>
        <span id="header-date" class="header__date"></span>

        <div class="header__actions">
            <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>

            </div>

            <div style="padding: 2rem;">
                <div class="timetable-editor">
                    <h2 style="margin:0 0 1.5rem 0;"> Timetable Editor</h2>
                    
                    <div class="editor-toolbar">
                        <select id="class-select" class="form-input">
                            <option value="">Select Class</option>
                        </select>
                        <button id="saveBtn" class="btn btn--primary"> Save</button>
                        <button id="resetBtn" class="btn btn--outline"> Reset to Default</button>
                    </div>

                    <div class="table-responsive">
                        <table class="attendance-table" style="width:100%;">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Period 1</th>
                                    <th>Period 2</th>
                                    <th>Period 3</th>
                                    <th>Period 4</th>
                                    <th>Period 5</th>
                                    <th>Period 6</th>
                                    <th>Period 7</th>
                                </tr>
                            </thead>
                            <tbody id="editor-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

    <div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 24px; border-radius:8px; z-index:9999; font-weight:500;"></div>

        });
